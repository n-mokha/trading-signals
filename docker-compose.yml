services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tradingsignals_db
    environment:
      POSTGRES_DB: ${DB_NAME:-tradingsignals}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tradingsignals}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: tradingsignals_ingestion
    env_file: .env
    volumes:
      - ./config:/app/config:ro   # mount config as read-only; edit on host, no rebuild needed
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: tradingsignals_engine
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: tradingsignals_grafana
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/analyst_recommendations.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescale_data:
    driver: local
  grafana_data:
    driver: local
