apiVersion: 1

datasources:
  - name: TradingSignals
    uid: tradingsignals
    type: postgres
    url: timescaledb:5432
    user: postgres
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      database: tradingsignals
      sslmode: disable
      timescaledb: true
      maxOpenConns: 10
      maxIdleConns: 5
    isDefault: true
    editable: false
